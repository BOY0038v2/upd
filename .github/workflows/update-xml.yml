name: Auto Update XML

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check and update XML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: "gorhill/uBlock"
          ASSET_ENDS_WITH: ".chromium.crx"
        run: python update_release.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain update.xml)" ]; then
            echo "No changes to commit."
          else
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git add update.xml
            git commit -m "Update version to latest release"
            git push
          fi
